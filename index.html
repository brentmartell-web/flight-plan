/* ---------- backup and sync ---------- */
function exportData(){
  const now=Date.now();
  // a running timer is written as if stopped now, so the other device gets the time so far
  const tasks=state.tasks.map(t=>{
    const o=Object.assign({},t);
    if(o.runningSince){ const add=Math.max(0,now-o.runningSince); o.trackedMs=(o.trackedMs||0)+add; o.sessions=(o.sessions||[]).concat(add>=1000?[{s:o.runningSince,e:now}]:[]).slice(-150); o.runningSince=null; }
    return o;
  });
  return {app:'Flight Plan',version:2,exported:new Date(now).toISOString(),tasks,deleted:Object.entries(state.tombs).map(([id,updatedAt])=>({id,updatedAt})),settings:state.settings};
}
async function saveBackup(){
  const name='flight-plan-'+isoDate()+'.json';
  const blob=new Blob([JSON.stringify(exportData(),null,1)],{type:'application/json'});
  let file=null; try{ file=new File([blob],name,{type:'application/json'}); }catch(e){}
  // on iPhone the share sheet's "Save to Files" is the reliable way to keep a file
  if(matchMedia('(pointer:coarse)').matches&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return backedUp('Backup shared. If you chose Save to Files, it’s in iCloud Drive.'); }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  backedUp('Backup saved as '+name);
}
function backedUp(msg){ setMeta({lastBackup:Date.now(),backupSnooze:0}); toast(msg); render(); }
/* Merge a backup into this device. For each task the most recently changed copy wins;
   deletions recorded on the other device remove older local copies. Old backups without
   updatedAt fall back to doneAt or createdAt. */
function mergeData(j){
  const incoming=Array.isArray(j)?j:j&&Array.isArray(j.tasks)?j.tasks:null;
  if(!incoming) return null;
  const stamp=t=>t.updatedAt||t.doneAt||t.createdAt||0;
  let added=0, updated=0, removed=0;
  incoming.forEach(t=>{
    if(!t||!t.id||!t.title||!/^[\w-]+$/.test(t.id)) return;
    const local=getTask(t.id), s=stamp(t);
    if((state.tombs[t.id]||0)>=s&&state.tombs[t.id]!==undefined) return;
    if(local&&(stamp(local)>=s||local.runningSince)) return;
    persist(Object.assign(newTask(t),t,{runningSince:null,updatedAt:s}),true);
    local?updated++:added++;
  });
  (Array.isArray(j.deleted)?j.deleted:[]).forEach(d=>{
    if(!d||!d.id||!d.updatedAt) return;
    const local=getTask(d.id);
    if(local){ if(stamp(local)<=d.updatedAt&&!local.runningSince){ removeTask(d.id,d.updatedAt); removed++; } }
    else if((state.tombs[d.id]||0)<d.updatedAt){ state.tombs[d.id]=d.updatedAt; write(()=>idb.put('tasks',{id:d.id,deleted:true,updatedAt:d.updatedAt})); }
  });
  if(j.settings&&(j.settings.updatedAt||0)>(state.settings.updatedAt||0)){
    state.settings=Object.assign({},DEFAULT_SETTINGS,j.settings); write(()=>idb.put('kv',state.settings,'settings'));
  }
  return {added,updated,removed};
}
function importBackup(j){
  const r=mergeData(j);
  if(!r){ toast('That file isn’t a Flight Plan backup.'); return; }
  setMeta({lastImport:Date.now()});
  state.importText=''; state.importItems=null;
  const parts=[r.added&&r.added+' added',r.updated&&r.updated+' updated',r.removed&&r.removed+' removed'].filter(Boolean);
  toast(parts.length?'Synced: '+parts.join(', '):'Already up to date');
  render();
}

/* ---------- sound ---------- */
let actx=null;
function unlockAudio(){ try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
function chime(){
  try{ if(navigator.vibrate) navigator.vibrate([120,80,120]); }catch(e){}
  if(!actx) return;
  try{ [0,0.22].forEach((d,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=i?1046.5:784; g.gain.setValueAtTime(0.0001,actx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d+0.7); o.connect(g).connect(actx.destination); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.75); }); }catch(e){}
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,undo){
  const el=$('#toast'); el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-action="undo">Undo</button>':'');
  el.classList.add('on'); el._undo=undo;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),undo?6000:3500);
}

/* =========================================================
   Navigation and events
   ========================================================= */
function go(view,list){
  state.view=view; state.list=list||null; state.navOpen=false;
  const h=view==='all'&&list?'list-'+slug(list):view;
  if(location.hash.slice(1)!==h){ try{ history.replaceState(null,'','#'+h); }catch(e){ location.hash=h; } }
  render(); window.scrollTo(0,0);
}
function fromHash(){
  const h=location.hash.slice(1);
  if(h.startsWith('list-')){ const l=lists().find(x=>slug(x)===h.slice(5)); state.view='all'; state.list=l||null; }
  else if(VIEWS.some(v=>v[0]===h)){ state.view=h; state.list=null; }
}
function select(id){ state.selected=id; renderDetail(true); renderContent(); renderActive(); }

document.addEventListener('click',e=>{
  unlockAudio();
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const l=e.target.closest('[data-list]'); if(l){ go('all',l.dataset.list); return; }
  const pri=e.target.closest('[data-pri]'); if(pri){ patch(state.selected,{priority:pri.dataset.pri}); render(); renderDetail(true); return; }
  const est=e.target.closest('[data-est]'); if(est){ const t=getTask(state.selected); const v=+est.dataset.est; patch(state.selected,{estimateMin:t.estimateMin===v&&est.closest('.estchips')?null:v}); render(); renderDetail(true); return; }
  const bl=e.target.closest('[data-block]'); if(bl){ state.blockMin=+bl.dataset.block; ls.set('fp-block',state.blockMin); state.blockStart=state.blockMin&&running()?Date.now():null; state.blockMsg=''; renderFocus(); return; }
  const mb=e.target.closest('[data-minblock]'); if(mb){ saveSettings({minBlock:+mb.dataset.minblock}); renderContent(); return; }
  const rv=e.target.closest('[data-rev]'); if(rv){ const t=getTask(state.selected); if(!t) return; const on=rv.dataset.rev==='on'; if(on!==!!t.reviews){ patch(t.id,{reviews:on?reviewDefaults():null}); render(); renderDetail(true); } return; }
  if(e.target.id==='scrim'){ state.navOpen=false; if(state.selected) state.selected=null; render(); return; }
  const a=e.target.closest('[data-action]'); if(!a) return;
  const row=a.closest('.row'), id=row?row.dataset.id:state.selected;
  switch(a.dataset.action){
    case 'nav': state.navOpen=!state.navOpen; renderNav(); $('#scrim').classList.toggle('on',state.navOpen); break;
    case 'open': select(id); break;
    case 'check': { const t=getTask(id); t&&t.done?uncomplete(id):completeTask(id); break; }
    case 'timer': toggleTimer(id); break;
    case 'complete': completeTask(id); break;
    case 'reopen': uncomplete(id); renderDetail(true); break;
    case 'closedetail': state.selected=null; render(); break;
    case 'delete': { const t=getTask(id); if(!t) break; lastDeleted=t; removeTask(id); state.selected=null; render(); toast('Deleted “'+(t.title.length>30?t.title.slice(0,30)+'…':t.title)+'”',()=>{ persist(Object.assign({},lastDeleted,{runningSince:null})); render(); }); break; }
    case 'focus': openFocus(id); break;
    case 'focusrun': { const t=running(); if(t) openFocus(t.id); break; }
    case 'openrun': { const t=running(); if(t) select(t.id); break; }
    case 'pauserun': { const t=running(); if(t){ stopTimer(t.id); render(); } break; }
    case 'closefocus': closeFocus(); break;
    case 'break': { const t=getTask(state.selected); if(t&&t.runningSince) stopTimer(t.id); state.onBreak=Date.now()+5*60000; state.breakDone=false; state.blockMsg=''; render(); break; }
    case 'newblock': state.blockStart=Date.now(); state.blockMsg=''; renderFocus(); break;
    case 'endbreak': state.onBreak=null; state.blockMsg=''; startTimer(state.selected); render(); break;
    case 'addtime': { const v=+($('#d-add').value||0); if(v>0){ const t=getTask(id); const now=Date.now(); persist(Object.assign({},t,{trackedMs:(t.trackedMs||0)+v*60000,sessions:(t.sessions||[]).concat([{s:now-v*60000,e:now,manual:true}]).slice(-150)})); render(); renderDetail(true); } break; }
    case 'resettime': { const t=getTask(id); if(t){ const prev=t; persist(Object.assign({},t,{trackedMs:0,sessions:[]})); render(); renderDetail(true); toast('Tracked time cleared',()=>{ persist(prev); render(); renderDetail(true); }); } break; }
    case 'preview': previewImport(); break;
    case 'clearimport': state.importItems=null; state.importText=''; render(); break;
    case 'doimport': doImport(); break;
    case 'backup': saveBackup(); break;
    case 'snoozebackup': setMeta({backupSnooze:Date.now()+864e5}); renderBanner(); break;
    case 'reload': location.reload(); break;
    case 'openid': select(a.dataset.id); break;
    case 'approveplan': approvePlan(); break;
    case 'addaway': {
      const f=$('#away-from').value, to=$('#away-to').value||f;
      if(!f){ toast('Pick the first day you’re away'); break; }
      const r=f<=to?{from:f,to}:{from:to,to:f};
      saveSettings({away:(state.settings.away||[]).concat([r]).sort((x,y)=>x.from.localeCompare(y.from))}); render(); break;
    }
    case 'rmaway': saveSettings({away:state.settings.away.filter((_,i)=>i!==+a.dataset.i)}); render(); break;
    case 'newtask': { if(!['today','upcoming','all'].includes(state.view)) go('today'); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>{ const q=$('#quick'); q&&q.focus(); },150); break; }
    case 'undo': { const u=$('#toast')._undo; $('#toast').classList.remove('on'); if(u) u(); break; }
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addform') return; e.preventDefault();
  const q=$('#quick'), v=q.value.trim(); if(!v) return;
  const p=parseQuick(v); if(!p.title) p.title=v;
  if(state.view==='today'&&!p.due) p.due=isoDate();
  if(state.view==='all'&&state.list&&!p.list) p.list=state.list;
  p.list=p.list?matchList(p.list):'Inbox';
  p.reviews=p.reviews?reviewDefaults():null;
  const t=newTask(p); persist(t); q.value=''; render(); $('#quick')&&$('#quick').focus();
  if(state.view==='upcoming'&&(!t.due||t.due<=isoDate())) toast('Added to '+(t.due?'Today':'All tasks'));
});
document.addEventListener('input',e=>{
  if(e.target.id==='quick') renderChips();
  if(e.target.id==='d-title'){ autosize(e.target); debounce('title',()=>{ const v=e.target.value.trim(); if(v) { patch(state.selected,{title:v}); renderContent(); renderActive(); } },500); }
  if(e.target.id==='d-notes') debounce('notes',()=>patch(state.selected,{notes:e.target.value}),700);
  if(e.target.id==='imp') state.importText=e.target.value;
  if(e.target.matches('[data-sel]')){ state.importSel[+e.target.dataset.sel]=e.target.checked; const n=Object.values(state.importSel).filter(Boolean).length; const b=$('[data-action="doimport"]'); if(b){ b.disabled=!n; b.textContent='Import '+n+' task'+(n===1?'':'s'); } }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='syncfile'){
    const file=el.files&&el.files[0]; el.value=''; if(!file) return;
    file.text().then(txt=>{ let j=null; try{ j=JSON.parse(txt); }catch(err){} if(j) importBackup(j); else toast('That file isn’t a Flight Plan backup.'); });
    return;
  }
  if(el.dataset&&el.dataset.hours!==undefined){ const h=state.settings.hours.slice(); h[+el.dataset.hours]=Math.round(Math.min(16,Math.max(0,+el.value||0))*60); saveSettings({hours:h}); renderContent(); return; }
  if(el.id==='rev-int'){ const iv=parseIntervals(el.value); if(iv.length) saveSettings({reviewIntervals:iv}); renderContent(); return; }
  if(el.id==='rev-min'){ const v=Math.round(+el.value); if(v>0) saveSettings({reviewMin:v}); renderContent(); return; }
  if(el.dataset&&el.dataset.rf&&state.selected){
    const t=getTask(state.selected), r=Object.assign({},t.reviews||reviewDefaults());
    if(el.dataset.rf==='intervals'){ const iv=parseIntervals(el.value); if(iv.length) r.intervals=iv; }
    else { const v=Math.round(+el.value); if(v>0) r.min=v; }
    patch(t.id,{reviews:r}); render(); renderDetail(true); return;
  }
  const f=e.target.dataset&&e.target.dataset.f; if(!f||!state.selected) return;
  let v=e.target.value;
  if(f==='estimateMin'){ v=Math.round(+v)||null; }
  if(f==='due'||f==='dueTime'||f==='recur') v=v||null;
  if(f==='list') v=matchList(v.trim())||'Inbox';
  if(f==='title'){ v=v.trim(); if(!v) return; }
  const extra={}; if(f==='recur'&&v&&!getTask(state.selected).due) extra.due=isoDate();
  patch(state.selected,Object.assign({[f]:v},extra)); render(); if(f==='estimateMin'||f==='recur') renderDetail(true);
});
document.addEventListener('keydown',e=>{
  const typing=e.target.matches('input,textarea,select');
  if(e.key==='Escape'){ if(state.focusOpen) closeFocus(); else if(state.navOpen){ state.navOpen=false; render(); } else if(state.selected&&!typing){ state.selected=null; render(); } else if(typing) e.target.blur(); }
  if(!typing&&(e.key==='n'||e.key==='/')&&$('#quick')){ e.preventDefault(); $('#quick').focus(); }
  if(e.target.id==='d-title'&&e.key==='Enter'){ e.preventDefault(); e.target.blur(); }
});
const debT={}; function debounce(k,fn,ms){ clearTimeout(debT[k]); debT[k]=setTimeout(fn,ms); }
window.addEventListener('hashchange',()=>{ fromHash(); render(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });

/* one-second tick: only live elements, not a full render */
let lastMinute=new Date().getMinutes();
setInterval(()=>{
  const t=running();
  if(t){
    const el=elapsed(t), est=t.estimateMin;
    document.querySelectorAll('.live-el').forEach(n=>{ if(n.dataset.id===t.id) n.textContent=clock(el); });
    const bar=document.querySelector('[data-live-bar="'+t.id+'"]'); if(bar&&est) bar.style.width=Math.min(100,el/(est*60000)*100)+'%';
    if(est&&el>est*60000){ const tt=document.querySelector('[data-live-t="'+t.id+'"]'); if(tt&&!tt.classList.contains('over')){ tt.classList.add('over'); bar&&bar.parentNode.classList.add('over'); } }
    if(state.selected===t.id){ const c=$('#d-clock'); if(c) c.textContent=clock(el); const s=$('#d-sub'); if(s&&est) s.textContent=el>est*60000?fmtDur(el-est*60000)+' over the '+fmtMin(est)+' estimate':fmtDur(est*60000-el)+' left of '+fmtMin(est); const b=$('#d-bar'); if(b&&est) b.style.width=Math.min(100,el/(est*60000)*100)+'%'; }
  }
  if(state.focusOpen) tickFocus();
  const m=new Date().getMinutes();
  if(m!==lastMinute){ lastMinute=m; if(state.view==='today'&&!(document.activeElement&&document.activeElement.id==='quick')){ const d=$('#daybar'); if(d){ const tmp=document.createElement('div'); tmp.innerHTML=dayBarHTML(); d.replaceWith(tmp.firstChild); } } if(m===0) render(); }
},1000);

/* On iPhone the keyboard covers the bottom of the screen without resizing the page. Fit the
   edit sheet to the part you can still see, and bring the field you're typing in into view. */
const vv=window.visualViewport;
function fitSheet(){
  const s=document.documentElement.style;
  if(vv&&innerHeight-vv.height>80){ s.setProperty('--vv-top',vv.offsetTop+'px'); s.setProperty('--vv-h',vv.height+'px'); }
  else{ s.removeProperty('--vv-top'); s.removeProperty('--vv-h'); }
}
if(vv){ vv.addEventListener('resize',fitSheet); vv.addEventListener('scroll',fitSheet); }
document.addEventListener('focusin',e=>{
  const f=e.target; if(!f.matches||!f.matches('#detail input,#detail textarea,#detail select')) return;
  setTimeout(()=>{ fitSheet(); f.scrollIntoView({block:'center',behavior:'smooth'}); },350);
});
if(bc) bc.onmessage=()=>{ if(idb.db) loadAll().then(render).catch(()=>{}); };
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='updated'){ state.updateReady=true; renderBanner(); } });
}

fromHash();
render();
initStore();
</script>
